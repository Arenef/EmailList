<!DOCTYPE html>
<html>
<head>
    <meta charset = "utf-8">
    <title> Murach's Java Servlets and JSP </title>
    <link rel="stylesheet" href="styles/main.css" type="text/css">
</head>
<body>
    <h1> Join our email list</h1>
    <p> To join our email list, enter your name and email address below.</p>

    <form action = "emailList" method = "post"> <!-- post đóng gói dữ liệu vào bên trong request -->
        <input type = "hidden" name = "action" value = "add"> <!-- input dùng để nhận dữ liệu từ người dùng -->
        <label> Email: </label>
        <input type = "email" name = "email" required><br>
        <label> First Name: </label>
        <input type = "text" name = "firstName" required><br>
        <label> Last Name: </label>
        <input type = "text" name = "lastName" required><br>

        <label> &nbsp; </label> <!-- là viết tắt của Non-Breaking Space (khoảng trắng không ngắt dòng) trong HTML. -->
        <input type = "submit" value = "Join Now" id = "submit">
    </form>
</body>
</html>
